<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 외부 스크립트·외부 전송 금지: 이 파일 안의 코드만 실행되고, 어디로도 데이터를 보내지 않는다 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>복약 알림 등록 · 아현올리브약국</title>
<style>
  :root { --bg:#f5f8f6; --fg:#14201a; --dim:#5f6d66; --brand:#0CAB60; --brand-ink:#fff; --card:#fff; --line:#dde5e0; --soft:#e7f6ee; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1512; --fg:#e7eee9; --dim:#9aa9a1; --card:#18211c; --line:#2a3630; --soft:#16301f; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  main { max-width:460px; margin:0 auto; padding:22px 16px 36px; }
  h1 { font-size:22px; margin:0 0 2px; }
  .sub { color:var(--dim); margin:0 0 18px; font-size:15px; }
  h2 { font-size:15px; color:var(--dim); margin:18px 0 8px; font-weight:700; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .grid.three { grid-template-columns:repeat(3,1fr); }
  .chip { appearance:none; font:inherit; font-weight:700; font-size:16px; padding:12px 4px; border-radius:12px; cursor:pointer;
          background:var(--card); color:var(--fg); border:1.5px solid var(--line); -webkit-tap-highlight-color:transparent; }
  .chip.on { background:var(--brand); color:var(--brand-ink); border-color:var(--brand); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:6px 14px; }
  .trow { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .trow:last-child { border-bottom:0; }
  .trow b { font-size:17px; }
  .trow small { color:var(--dim); margin-left:6px; }
  input[type=time], input[type=date], input[type=number] { font:inherit; font-size:17px; font-weight:700; padding:8px 10px; border-radius:10px;
          border:1.5px solid var(--line); background:var(--bg); color:var(--fg); }
  input[type=number] { width:84px; text-align:right; }
  .empty { color:var(--dim); padding:12px 0; }
  .sum { background:var(--soft); border-radius:12px; padding:12px 14px; margin-top:16px; font-weight:700; }
  a.btn { display:block; text-align:center; background:var(--brand); color:#fff; text-decoration:none; font-weight:800;
          font-size:18px; padding:16px; border-radius:14px; margin:14px 0 8px; }
  a.btn.off { opacity:.35; pointer-events:none; }
  /* 예비 버튼: 기본 버튼(초록)과 구분되는 자주~갈색 테두리 상자 (크기는 기본 버튼보다 약간 작게) */
  :root { --alt:#8a4560; }
  @media (prefers-color-scheme: dark) { :root { --alt:#d99ab3; } }
  a.alt { display:block; text-align:center; color:var(--alt); background:transparent; border:2px solid var(--alt);
          text-decoration:none; font-weight:800; font-size:16px; padding:13px; border-radius:14px; margin:0 0 8px; }
  .help { color:var(--dim); font-size:14px; margin:6px 0 0; }
  footer { color:var(--dim); font-size:12.5px; margin-top:28px; border-top:1px solid var(--line); padding-top:12px; line-height:1.6; }
</style>
</head>
<body>
<main>
  <h1>복약 알림 등록</h1>
  <p class="sub"> <b>알림 시각을</b> 생활에 맞게 바꾼 뒤 버튼을 누르시면
    알림이 캘린더 앱에 전달됩니다.</p>

  <h2>알림 시각</h2>
  <div class="card" id="times"></div>

  <div class="sum" id="sum"></div>
  <a class="btn off" id="add" href="#">캘린더에 알림 추가</a>
  <a class="alt" id="add2" href="#">버튼이 안 되면 여기</a>
  <p class="help" id="help"></p>

  <footer>
    이 페이지는 이름·연락처 등 개인정보를 수집하거나 저장하지 않으며, 어디로도 전송하지 않습니다.
    알림 일정은 이 휴대폰 안에서만 만들어져 캘린더 앱으로 전달됩니다.<br>
    
    아현올리브약국
  </footer>
</main>
<script>
// QR 주소 예: https://ahyeonolive.github.io/?p=m,e&d=30   (약국 검수 화면 scan.html에서 만든 QR)
//   p 복용 시간 (m 아침, l 점심, e 저녁, b 자기전, o 하루에 한 번, d2 2일에 1번, d3 3일에 1번)
//   d 복용 일수
// 복용 시간 종류와 일수는 약국이 정한 그대로. 손님은 각 알림 시각만 바꿀 수 있다. 개인정보는 받지 않는다.
(function () {
  const DAILY = [
    { k: 'm', name: '아침', t: '08:00' }, { k: 'l', name: '점심', t: '12:30' },
    { k: 'e', name: '저녁', t: '19:30' }, { k: 'b', name: '자기전', t: '23:00' },
  ];
  const SINGLE = [
    { k: 'o', name: '하루에 한 번', t: '12:00', iv: 1 },
    { k: 'd2', name: '2일에 1번', t: '19:00', iv: 2 },
    { k: 'd3', name: '3일에 1번', t: '19:00', iv: 3 },
  ];
  const ALL = [...DAILY.map(x => ({ ...x, iv: 1 })), ...SINGLE];
  const pad = n => String(n).padStart(2, '0');
  const now = new Date();
  const todayISO = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  const q = new URLSearchParams(location.search);

  // 복용 시간은 약국이 QR에 정한 것만 (손님은 시각만 바꿀 수 있음)
  const sel = new Map();                       // k → 시각 'HH:MM'
  for (const k of (q.get('p') || '').split(',')) {
    const x = ALL.find(a => a.k === k);
    if (x && !sel.has(k)) sel.set(k, x.t);
  }
  if ([...sel.keys()].some(k => SINGLE.some(x => x.k === k)) && sel.size > 1)
    sel.clear();                               // '하루에 한 번'·'2일'·'3일'은 단독 — 섞인 QR은 잘못된 것
  const days0 = parseInt(q.get('d') || '', 10);
  const DAYS = days0 > 0 && days0 <= 365 ? days0 : 0;
  const $ = id => document.getElementById(id);

  function timeRows() {
    const items = ALL.filter(x => sel.has(x.k));
    $('times').innerHTML = items.map(x =>
      `<div class="trow"><span><b>${x.name}</b>${x.iv > 1 ? `<small>${x.iv}일마다</small>` : '<small>매일</small>'}</span>`
      + `<input type="time" data-k="${x.k}" value="${sel.get(x.k)}"></div>`).join('');
    document.querySelectorAll('#times input').forEach(el => el.onchange = () => {
      if (/^\d{2}:\d{2}$/.test(el.value)) sel.set(el.dataset.k, el.value);
      else el.value = sel.get(el.dataset.k);
      build();
    });
  }
  function render() { timeRows(); build(); }

  let blobUrl = null;
  function build() {
    const items = ALL.filter(x => sel.has(x.k));
    const days = DAYS, start = todayISO;          // 시작은 QR을 찍은 날
    const a1 = $('add'), a2 = $('add2');
    if (!items.length || !days) {
      $('times').innerHTML = '<div class="empty">QR 정보가 올바르지 않습니다. 약국에 문의해 주세요.</div>';
      $('sum').style.display = 'none';
      a1.classList.add('off'); a2.style.display = 'none'; $('help').textContent = '';
      return;
    }
    const s8 = start.replace(/-/g, '');
    const stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
    const fmtT = t => { const h = +t.slice(0, 2); return `${h < 12 ? '오전' : '오후'} ${h % 12 || 12}:${t.slice(3)}`; };
    const ev = items.map((x, i) => {
      const t = sel.get(x.k).replace(':', ''), n = Math.ceil(days / x.iv);
      const end = `${t.slice(0, 2)}${pad(Math.min(59, +t.slice(2) + 10))}`;
      const title = `약 복용 (${x.name})`;
      return ['BEGIN:VEVENT', `UID:${s8}-${x.k}-${t}-${Math.random().toString(36).slice(2)}@ahyeonolive`, `DTSTAMP:${stamp}`,
        `SUMMARY:${title}`, `DTSTART:${s8}T${t}00`, `DTEND:${s8}T${end}00`,
        `RRULE:FREQ=DAILY;INTERVAL=${x.iv};COUNT=${n}`,
        'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${title}`, 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT'].join('\r\n');
    });
    const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//ahyeonolive//med-alarm//KO', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
      ...ev, 'END:VCALENDAR'].join('\r\n');
    const last = new Date(+start.slice(0, 4), +start.slice(5, 7) - 1, +start.slice(8) + days - 1);
    $('sum').innerHTML = items.map(x => `${x.name} ${fmtT(sel.get(x.k))} · ${x.iv > 1 ? x.iv + '일마다 ' : '매일 '}${Math.ceil(days / x.iv)}회`).join('<br>')
      + `<br><span style="font-weight:400">${+start.slice(5, 7)}/${+start.slice(8)} ~ ${last.getMonth() + 1}/${last.getDate()}</span>`;
    if (blobUrl) URL.revokeObjectURL(blobUrl);
    blobUrl = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
    const dataUrl = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
    const fname = `복약알림_${s8}.ics`;
    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    a1.classList.remove('off'); a2.style.display = '';
    a1.href = ios ? dataUrl : blobUrl; a1.toggleAttribute('download', !ios); if (!ios) a1.download = fname;
    a2.href = ios ? blobUrl : dataUrl; a2.toggleAttribute('download', ios); if (ios) a2.download = fname;
    $('help').innerHTML = ios
      ? '‘캘린더에 추가’ 화면이 뜨면 <b>모두 추가</b>를 누르세요.'
      : '내려받은 파일을 열고 <b>캘린더</b>를 선택한 뒤 <b>저장</b>을 누르세요.';
    window.__ics = ics;   // 시험용
  }
  render();
})();
</script>
</body>
</html>
